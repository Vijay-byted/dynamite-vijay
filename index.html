<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#241044">
<meta name="description" content="Dynamite Vijay Study App">
<link rel="manifest" href="manifest.json">
<title>Dynamite Vijay</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f7f4fc;
 color:#241044;
}
header{
 background:linear-gradient(135deg,#241044,#62349c);
 color:white;padding:24px 18px;
 border-radius:0 0 25px 25px;
}
.brand{font-size:25px;font-weight:900;color:#ffd66b}
header p{color:#e8dcff}
nav{
 display:flex;justify-content:space-around;
 padding:15px 8px;background:white;
}
nav button{
 border:0;background:#eee5fc;
 padding:11px;border-radius:12px;
 color:#32135e;font-weight:bold;
}
nav button.active{background:#62349c;color:white}
.card{
 background:white;margin:15px;padding:18px;
 border-radius:18px;
 box-shadow:0 4px 18px #24104412;
}
.banner{
 background:linear-gradient(120deg,#492078,#9a65d4);
 color:white;padding:22px;border-radius:18px;
}
.banner h2{margin:0}
.search{
 width:100%;padding:14px;
 border:1px solid #ddd;border-radius:12px;
}
.action{
 background:#62349c;color:white;
 padding:12px 18px;border:0;
 border-radius:12px;margin-top:12px;
 font-weight:bold;
}
.drawer{display:none;background:white;padding:15px;margin:12px;border-radius:15px}
.drawer.show{display:block}
.drawer p{padding:10px;border-bottom:1px solid #eee}
h2{margin:15px}
footer{text-align:center;padding:25px;color:#777}
</style>
</head>

<body>
<header>
<div class="brand">👑 DYNAMITE VIJAY</div>
<p>Study Smart. Score High.</p>
</header>

<nav>
<button onclick="home()">Home</button>
<button onclick="courses()">Courses</button>
<button onclick="menu()">☰ Menu</button>
</nav>

<div id="drawer" class="drawer">
<p>🏠 Home</p>
<p>📚 My Courses</p>
<p>📥 Downloads</p>
<p>🔔 Notifications</p>
<p>ℹ️ About Us</p>
<p>☎️ Support</p>
</div>

<main id="content">
<div class="card">
<div class="banner">
<h2>Welcome to Dynamite Vijay!</h2>
<p>Your learning journey starts here.</p>
</div>
</div>

<h2>📚 Available Courses</h2>
<div class="card">
<input class="search" id="search"
placeholder="Search courses..." oninput="filterCourses()">
</div>
<div id="courses"></div>
</main>

<footer>© 2026 Dynamite Vijay</footer>

<script>
const data=[
{name:"SSC CGL 2027",desc:"Complete SSC CGL preparation"},
{name:"Mathematics",desc:"Chapter-wise Maths classes"},
{name:"General Studies",desc:"Learn GK and Current Affairs"},
{name:"English",desc:"English Grammar and Practice"}
];

function render(items){
document.getElementById("courses").innerHTML=
items.map(c=>`
<div class="card">
<h3>📘 ${c.name}</h3>
<p>${c.desc}</p>
<button class="action" onclick="study('${c.name}')">
Study Now →
</button>
</div>`).join("");
}

function home(){
document.getElementById("content").innerHTML=`
<div class="card">
<div class="banner">
<h2>Welcome to Dynamite Vijay!</h2>
<p>Study Smart. Score High.</p>
</div></div>
<h2>📚 Available Courses</h2>
<div class="card">
<input class="search" id="search"
placeholder="Search courses..." oninput="filterCourses()">
</div><div id="courses"></div>`;
render(data);
document.getElementById("drawer").classList.remove("show");
}

function courses(){
document.getElementById("courses")?.scrollIntoView();
}

function menu(){
document.getElementById("drawer").classList.toggle("show");
}

function filterCourses(){
let q=document.getElementById("search").value.toLowerCase();
render(data.filter(c=>c.name.toLowerCase().includes(q)));
}

function study(name){
document.getElementById("content").innerHTML=`
<div class="card">
<button class="action" onclick="home()">← Back</button>
<h2>${name}</h2>
<h3>📚 Subjects</h3>
<div class="card">Mathematics</div>
<div class="card">General Studies</div>
<div class="card">English</div>
<h3>🎥 Video Lectures</h3>
<p>Lectures will be added soon.</p>
<h3>📄 PDF Notes</h3>
<p>Study material will be added soon.</p>
</div>`;
}
render(data);

if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("./sw.js")
.then(()=>console.log("Dynamite Vijay Ready"))
.catch(error=>console.log(error));
});
}
</script>
</body>
</html>
